<!DOCTYPE html>
<html>
    <head>
        <title>Update Task</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Update Task</h1>
        <form method="POST">

            <label>Title:</label>
            <input type="text" name="title" value="{{ task[1] }}">
            <br><br>
            
            <label>Description:</label>
            <textarea name="description">{{ task[2] }}</textarea>
            <br><br>

            <label>Priority:</label>
            <input type="text" name="priority" value="{{ task[3] }}">
            <br><br>

            <label>Status:</label>
            <input type="text" name="status" value="{{ task[4] }}">
            <br><br>

            <button type="submit">Update Task</button>
        </form>
    </body>
</html>
